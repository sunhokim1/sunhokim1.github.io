---
layout: default
title: 전체 글
---
<div class="page-heading"><h1 id="list-title">전체 글</h1></div><div class="section-heading"><h2>글 목록</h2><span id="post-count">{{ site.posts.size }}개의 글</span></div><div class="posts" id="post-list">{% for post in site.posts %}<article data-categories="{{ post.categories | join: '|' | escape }}"><div class="post-body"><p class="meta">{{ post.categories | join: ' / ' | escape }}</p><h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2></div>{% if post.thumbnail %}<img class="post-thumb" src="{% if post.thumbnail contains '://' %}{{ post.thumbnail | escape }}{% else %}{{ post.thumbnail | relative_url }}{% endif %}" alt="" loading="lazy">{% endif %}</article>{% endfor %}</div><p id="empty-list" hidden>이 분야에 등록된 글이 없습니다.</p>
