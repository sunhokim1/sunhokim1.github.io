<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | default: site.title | escape }} | {{ site.title | escape }}</title><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></head><body><div class="wrap"><header><div class="header-inner"><a class="brand" href="{{ '/' | relative_url }}">김선호의 개발 기록</a><a class="home-link" href="{{ '/' | relative_url }}">전체 글</a></div></header><div class="shell"><aside><p class="aside-label">분야</p><nav aria-label="분야"><a class="category-link" data-category="" href="{{ '/' | relative_url }}">전체 글 <span>{{ site.posts.size }}</span></a>{% for category in site.categories %}<a class="category-link" data-category="{{ category[0] | escape }}" href="{{ '/' | relative_url }}?category={{ category[0] | url_encode }}">{{ category[0] | escape }} <span>{{ category[1].size }}</span></a>{% endfor %}</nav></aside><main>{{ content }}</main></div><footer>© 김선호 <span>임베디드 개발 기록</span></footer></div><script src="{{ '/assets/js/category.js' | relative_url }}" defer></script></body></html>
