<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ page.title | default: site.title | escape }} | {{ site.title | escape }}</title><link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"></head>
<body><div class="wrap"><header><a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a><p>임베디드 개발 프로젝트와 기록</p></header><nav aria-label="분야"><a href="{{ '/' | relative_url }}">전체 글</a>{% for category in site.categories %}<a href="{{ '/' | relative_url }}#{{ category[0] | slugify }}">{{ category[0] | escape }}</a>{% endfor %}</nav><main>{{ content }}</main><footer>김선호 · 임베디드 개발 기록</footer></div></body></html>
